name: Build Gaming DNS APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Print toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android scaffold and restore app files
        shell: bash
        run: |
          set -euo pipefail
          BACKUP=/tmp/gaming-dns-backup
          SCAFFOLD=/tmp/gaming-dns-scaffold
          mkdir -p "$BACKUP/kotlin" "$BACKUP/drawable" "$BACKUP/values"

          cp android/app/src/main/AndroidManifest.xml "$BACKUP/AndroidManifest.xml"
          cp android/app/src/main/kotlin/com/example/gaming_dns/MainActivity.kt "$BACKUP/kotlin/MainActivity.kt"
          cp android/app/src/main/kotlin/com/example/gaming_dns/GamingVpnService.kt "$BACKUP/kotlin/GamingVpnService.kt"
          cp android/app/src/main/res/drawable/ic_launcher.xml "$BACKUP/drawable/ic_launcher.xml"
          cp android/app/src/main/res/values/styles.xml "$BACKUP/values/styles.xml"
          cp android/app/src/main/res/values/colors.xml "$BACKUP/values/colors.xml"

          rm -rf "$SCAFFOLD"
          flutter create --platforms=android --org com.example --project-name gaming_dns "$SCAFFOLD" 2>&1 | tee flutter-create.log

          test -d "$SCAFFOLD/android" || { echo 'Flutter did not create the Android scaffold.'; exit 1; }
          rm -rf android
          cp -a "$SCAFFOLD/android" android

          mkdir -p android/app/src/main/kotlin/com/example/gaming_dns
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/values
          cp "$BACKUP/AndroidManifest.xml" android/app/src/main/AndroidManifest.xml
          cp "$BACKUP/kotlin/MainActivity.kt" android/app/src/main/kotlin/com/example/gaming_dns/MainActivity.kt
          cp "$BACKUP/kotlin/GamingVpnService.kt" android/app/src/main/kotlin/com/example/gaming_dns/GamingVpnService.kt
          cp "$BACKUP/drawable/ic_launcher.xml" android/app/src/main/res/drawable/ic_launcher.xml
          cp "$BACKUP/values/styles.xml" android/app/src/main/res/values/styles.xml
          cp "$BACKUP/values/colors.xml" android/app/src/main/res/values/colors.xml

          python3 scripts/patch_android_gradle.py 2>&1 | tee gradle-patch.log
          chmod +x android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.properties

      - name: Resolve Flutter dependencies
        shell: bash
        run: flutter pub get 2>&1 | tee flutter-pub-get.log

      - name: Test IPv4/IPv6 converter
        shell: bash
        run: flutter test test/ip_converter_test.dart 2>&1 | tee flutter-test.log

      - name: Analyze Dart source (diagnostic)
        shell: bash
        run: flutter analyze --no-pub 2>&1 | tee flutter-analyze.log
        continue-on-error: true

      - name: Build release APK
        shell: bash
        run: flutter build apk --release --no-pub --verbose 2>&1 | tee build-release.log

      - name: Upload build diagnostics if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Build-Logs
          path: |
            flutter-create.log
            gradle-patch.log
            flutter-pub-get.log
            flutter-test.log
            flutter-analyze.log
            build-release.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Gaming-DNS-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
